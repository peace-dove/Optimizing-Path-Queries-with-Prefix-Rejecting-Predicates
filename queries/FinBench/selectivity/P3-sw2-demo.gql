-- Diagnostic demo: SW(2) + sum (sliding 2-edge sum; likely intended as a prefix sum).
-- Compiling this template triggers the compile-time warning; the query still runs as written.
MATCH p = (acc:Account WHERE acc.accountId IN {input_ids})
             -[e1:transfer]->{1,3} (other:Account)
WITH SW(2) ON p AS pp
WHERE sum(pp, relationships(pp).amount) < ${theta}
RETURN distinct other.id AS otherId,
                length(p) AS accountDistance
ORDER BY accountDistance, otherId;
